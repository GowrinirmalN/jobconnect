# Application Configuration
spring.application.name=jobconnect-backend
server.port=8080

# Active Profile (defaults to dev with embedded MySQL-compatible in-memory database)
# To run with live MySQL, pass --spring.profiles.active=mysql or set SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=dev

# In-Memory Dev Profile Database (H2 in MySQL mode for instant zero-dependency execution)
spring.datasource.url=jdbc:h2:mem:jobconnect_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JWT Configuration
app.jwt.secret=JobConnectSuperSecretSecureKeyForJwtTokensGeneration2026LongerKey123!
app.jwt.expiration-ms=86400000

# File Upload Configuration (PDF Resumes)
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
